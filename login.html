<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | WEAR.LAB</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <header class="gnb" id="gnb"></header>
  <main class="container narrow">
    <div class="tabs" id="authTabs">
      <button type="button" class="tab is-active" data-mode="login">로그인</button>
      <button type="button" class="tab" data-mode="signup">회원가입</button>
    </div>

    <!-- 로그인 -->
    <form class="form-box" id="loginForm" data-panel="login">
      <div class="field"><label for="liEmail">이메일</label><input id="liEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="liPw">비밀번호</label><input id="liPw" type="password" autocomplete="current-password" required></div>
      <button class="btn btn--dark" type="submit">로그인</button>
      <p class="msg" id="liMsg"></p>
      <p class="form-links"><button type="button" class="link" data-mode="reset">비밀번호 찾기</button> · <a class="link" href="order-lookup.html">비회원 주문 조회</a></p>
    </form>

    <!-- 회원가입 -->
    <form class="form-box" id="signupForm" data-panel="signup" hidden>
      <div class="field"><label for="suName">이름</label><input id="suName" autocomplete="name" required></div>
      <div class="field"><label for="suPhone">휴대폰 번호</label><input id="suPhone" inputmode="numeric" autocomplete="tel" placeholder="01012345678"></div>
      <div class="field"><label for="suEmail">이메일</label><input id="suEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="suPw">비밀번호</label><input id="suPw" type="password" autocomplete="new-password" placeholder="6자 이상" required></div>
      <button class="btn btn--dark" type="submit">가입하기</button>
      <p class="msg" id="suMsg"></p>
    </form>

    <!-- 비밀번호 찾기 -->
    <form class="form-box" id="resetForm" data-panel="reset" hidden>
      <p class="notice" style="margin:0 0 14px">가입한 이메일을 입력하면 비밀번호를 다시 정할 수 있는 링크를 보내 드립니다.</p>
      <div class="field"><label for="rsEmail">이메일</label><input id="rsEmail" type="email" autocomplete="email" required></div>
      <button class="btn btn--dark" type="submit">재설정 메일 받기</button>
      <p class="msg" id="rsMsg"></p>
      <p class="form-links"><button type="button" class="link" data-mode="login">로그인으로 돌아가기</button></p>
    </form>

    <!-- 새 비밀번호 (메일 링크로 들어온 경우) -->
    <form class="form-box" id="newPwForm" data-panel="newpw" hidden>
      <p class="notice" style="margin:0 0 14px">새 비밀번호를 입력해 주세요.</p>
      <div class="field"><label for="npPw">새 비밀번호</label><input id="npPw" type="password" autocomplete="new-password" placeholder="6자 이상" required></div>
      <button class="btn btn--dark" type="submit">비밀번호 변경</button>
      <p class="msg" id="npMsg"></p>
    </form>

    <div class="social" id="social">
      <p class="social__title">간편 로그인 · 가입</p>
      <button type="button" class="btn social__btn is-kakao" data-provider="kakao">카카오로 시작하기</button>
      <button type="button" class="btn social__btn is-google" data-provider="google">구글로 시작하기</button>
      <p class="msg" id="soMsg"></p>
    </div>
    <p class="notice" style="text-align:center">가입하지 않아도 상품을 구매할 수 있습니다.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
