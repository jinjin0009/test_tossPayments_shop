<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 완료 | WEAR.LAB</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="success">
  <header class="gnb" id="gnb"></header>
  <main class="result" id="result"></main>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      const q = new URLSearchParams(location.search);
      const paymentKey = q.get("paymentKey");
      const orderId = q.get("orderId");
      const amount = Number(q.get("amount"));
      const pending = Store.read("shop_pending_order", null);
      const box = document.getElementById("result");

      // 결제 요청 때 저장한 주문과 리다이렉트로 받은 값이 같은지 확인 (금액 위변조 방지)
      const valid = paymentKey && pending && pending.orderId === orderId && pending.amount === amount;

      if (!valid) {
        box.innerHTML = `
          <div class="result__icon is-fail">!</div>
          <h1>결제 정보를 확인할 수 없습니다</h1>
          <p>주문 정보가 일치하지 않습니다. 다시 시도해 주세요.</p>
          <dl><div><dt>orderId</dt><dd>${orderId || "-"}</dd></div><div><dt>amount</dt><dd>${amount || "-"}</dd></div></dl>
          <a class="btn btn--dark" href="top.html">쇼핑 계속하기</a>`;
        return;
      }

      if (!pending.isDirect) Cart.clear();
      Store.write("shop_pending_order", null);

      box.innerHTML = `
        <div class="result__icon">✓</div>
        <h1>주문이 완료되었습니다</h1>
        <p>${pending.orderName}</p>
        <dl>
          <div><dt>주문번호</dt><dd>${orderId}</dd></div>
          <div><dt>결제 금액</dt><dd>${won(amount)}</dd></div>
          <div><dt>paymentKey</dt><dd>${paymentKey}</dd></div>
        </dl>
        <a class="btn btn--dark" href="top.html">쇼핑 계속하기</a>
        <p class="notice" style="text-align:left">
          ※ 퍼블리싱 데모: 실제 결제 확정은 서버에서 시크릿 키로
          <code>POST https://api.tosspayments.com/v1/payments/confirm</code> 에
          paymentKey · orderId · amount 를 보내야 완료됩니다. 승인 요청을 하지 않으면 10분 후 결제가 만료됩니다.
        </p>`;
    })();
  </script>
</body>
</html>
