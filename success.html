<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>결제 완료 | WEAR.LAB</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="success">
  <header class="gnb" id="gnb"></header>
  <main class="result" id="result">
    <div class="spinner"></div>
    <h1>결제를 확인하고 있습니다</h1>
    <p>잠시만 기다려 주세요. 이 화면을 닫지 마세요.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/orders.js"></script>
  <script>
    (async function () {
      const q = new URLSearchParams(location.search);
      const paymentKey = q.get("paymentKey");
      const orderId = q.get("orderId");
      const amount = Number(q.get("amount"));
      const box = document.getElementById("result");
      await Shop.ready;

      // 서버에서 주문 금액 확인 → 재고 차감 → 토스 결제 승인까지 처리
      const res = await callFn("payment-confirm", { paymentKey, orderId, amount });

      if (!res.ok) {
        box.innerHTML = `
          <div class="result__icon is-fail">!</div>
          <h1>결제를 완료하지 못했습니다</h1>
          <p>${esc(res.message || "결제 정보를 확인할 수 없습니다.")}</p>
          <dl><div><dt>주문번호</dt><dd>${esc(orderId || "-")}</dd></div><div><dt>사유 코드</dt><dd>${esc(res.code || "-")}</dd></div></dl>
          <p class="notice">결제가 승인되지 않았으므로 요금이 청구되지 않습니다.</p>
          <a class="btn btn--dark" href="top.html">쇼핑 계속하기</a>`;
        return;
      }

      const o = res.order;
      const pending = Store.read("shop_pending_order", null);
      if (pending && pending.orderId === o.orderId && !pending.isDirect) Cart.clear();
      Store.write("shop_pending_order", null);

      const waiting = o.status === "awaiting_deposit";
      const v = o.paymentInfo && o.paymentInfo.virtualAccount;
      box.innerHTML = `
        <div class="result__icon">✓</div>
        <h1>${waiting ? "주문이 접수되었습니다" : "주문이 완료되었습니다"}</h1>
        <p>${esc(o.orderName)}</p>
        ${waiting ? `<p class="sale" style="margin-top:6px">아래 계좌로 입금하시면 결제가 완료됩니다.</p>` : ""}
        <dl>
          <div><dt>주문번호</dt><dd>${esc(o.orderId)}</dd></div>
          <div><dt>결제 금액</dt><dd>${won(o.amount)}</dd></div>
          <div><dt>결제 수단</dt><dd>${esc(o.method || "-")}</dd></div>
          ${waiting && v ? `<div><dt>입금 계좌</dt><dd>${esc(v.bank)} ${esc(v.accountNumber)}</dd></div><div><dt>입금 기한</dt><dd>${fmtDate(v.dueDate, true)}까지</dd></div>` : ""}
        </dl>
        <div class="btn-row">
          <a class="btn" href="top.html">쇼핑 계속하기</a>
          <a class="btn btn--dark" href="${Auth.user ? "mypage.html" : "order-lookup.html?orderId=" + encodeURIComponent(o.orderId)}">주문 내역 보기</a>
        </div>
        ${Auth.user ? "" : `<p class="notice">비회원 주문은 <b>주문번호</b>와 <b>휴대폰 번호</b>로 조회할 수 있습니다. 주문번호를 꼭 메모해 두세요.</p>`}`;
    })();
  </script>
</body>
</html>
