<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문서 | WEAR.LAB</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 토스페이먼츠 결제위젯 SDK v2 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body data-page="checkout">
  <header class="gnb" id="gnb"></header>
  <main class="container">
    <div class="page-head"><h1>주문서</h1></div>
    <div class="checkout">
      <div>
        <section class="section">
          <h2>주문 상품 <span class="count" id="itemCount" style="font-weight:400;font-size:13px;color:#8a8a8a"></span></h2>
          <div id="orderItems"></div>
        </section>

        <section class="section">
          <h2>주문자 · 배송 정보</h2>
          <p class="notice" id="memberNote" style="margin:-4px 0 14px"></p>
          <div class="field"><label for="buyerName">이름</label><input id="buyerName" placeholder="받는 분 이름" autocomplete="name"></div>
          <div class="field"><label for="buyerPhone">휴대폰 번호</label><input id="buyerPhone" placeholder="01012345678" inputmode="numeric" autocomplete="tel"></div>
          <div class="field"><label for="buyerEmail">이메일 (선택)</label><input id="buyerEmail" type="email" placeholder="주문 안내를 받을 이메일" autocomplete="email"></div>
          <div class="field" id="addrPick" hidden><label for="addrSelect">저장된 배송지</label><select id="addrSelect"></select></div>
          <div class="field"><label for="buyerAddr">배송지</label><input id="buyerAddr" placeholder="도로명 주소와 상세 주소" autocomplete="street-address"></div>
          <div class="field"><label for="shipMemo">배송 메모 (선택)</label><input id="shipMemo" placeholder="예: 문 앞에 놓아 주세요"></div>
          <div class="field" id="saveAddrRow" hidden><span></span><label class="check"><input type="checkbox" id="saveAddr" checked> 이 주소를 기본 배송지로 저장</label></div>
        </section>

        <section class="section">
          <h2>결제 수단</h2>
          <!-- 토스페이먼츠 결제 UI / 약관 UI 가 렌더링되는 영역 -->
          <div id="payment-method"></div>
          <div id="agreement"></div>
        </section>
      </div>

      <aside class="summary">
        <h2>결제 금액</h2>
        <div class="row"><span>상품 금액</span><span id="sumOrigin">0원</span></div>
        <div class="row"><span>할인 금액</span><span id="sumDiscount" class="sale">0원</span></div>
        <div class="row"><span>배송비</span><span id="sumShip">0원</span></div>
        <div class="row total"><span>총 결제 금액</span><span id="sumTotal">0원</span></div>
        <button type="button" class="btn btn--blue" id="payButton" disabled>결제하기</button>
        <p class="msg" id="payMsg"></p>
        <p class="notice">토스페이먼츠 <b>테스트 키</b>로 연동되어 있어 실제 출금이 되지 않습니다.<br>5만원 이상 구매 시 무료배송 (미만 3,000원)</p>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
